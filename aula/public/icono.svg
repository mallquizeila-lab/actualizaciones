<rect x="40" y="36" width="144" height="168" rx="22" fill="url(#tapa)"/>
<rect x="56" y="44" width="122" height="152" rx="16" fill="url(#hoja)" opacity=".18"/>
<g fill="#e2e8f0" stroke="#64748b" stroke-width="2.5"><rect x="32" y="56" width="20" height="10" rx="5"/><rect x="32" y="86" width="20" height="10" rx="5"/><rect x="32" y="116" width="20" height="10" rx="5"/><rect x="32" y="146" width="20" height="10" rx="5"/><rect x="32" y="176" width="20" height="10" rx="5"/></g>
<rect x="40" y="36" width="144" height="168" rx="22" fill="url(#brillo)"/>
