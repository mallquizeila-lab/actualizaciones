<circle cx="96" cy="99" r="10" fill="#0f172a"/><circle cx="146" cy="99" r="10" fill="#0f172a"/><circle cx="99" cy="95" r="3.5" fill="#fff"/><circle cx="149" cy="95" r="3.5" fill="#fff"/>
