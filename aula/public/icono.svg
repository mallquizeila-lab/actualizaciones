<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 240" role="img" aria-label="Libretín, la libreta amiga de docentes y familias">
<defs>
<linearGradient id="tapa" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#38bdf8"/><stop offset="1" stop-color="#0369a1"/></linearGradient>
<linearGradient id="hoja" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#e0f2fe"/></linearGradient>
<radialGradient id="brillo" cx=".3" cy=".2" r=".8"><stop offset="0" stop-color="#fff" stop-opacity=".45"/><stop offset=".6" stop-color="#fff" stop-opacity="0"/></radialGradient>
</defs>
<ellipse cx="112" cy="228" rx="70" ry="9" fill="#0f172a" opacity=".12"/>
<!-- piernitas -->
<rect x="80" y="196" width="14" height="26" rx="7" fill="#0369a1"/><rect x="128" y="196" width="14" height="26" rx="7" fill="#0369a1"/>
<ellipse cx="85" cy="222" rx="15" ry="8" fill="#fbbf24"/><ellipse cx="137" cy="222" rx="15" ry="8" fill="#fbbf24"/>
